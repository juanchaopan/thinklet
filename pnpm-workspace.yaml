packages:
  - apps/*
  - packages/*

allowBuilds:
  '@go-task/cli': true
  '@parcel/watcher': false
  cpu-features: false
  esbuild: false
  lefthook: true
  lmdb: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false

# Each override lifts a transitive development dependency past an advisory
# that no release of the direct dependency fixes yet. A selector names the
# vulnerable versions a dependent asks for, so it stops matching once the
# chain moves past them.
overrides:
  # @go-task/cli's downloader pins get-uri 8.0.1, whose basic-ftp 5.x has a
  # high-severity advisory (GHSA-c475-qrg2-pj4r); 8.0.2 depends on the fixed
  # basic-ftp 6.2.4 and later.
  get-uri@8.0.1: 8.0.2
  # GHSA-g3hv-75wg-m249 (denial of service via globparts amplification):
  # testcontainers' archiver (through glob 10) and license-checker's pinned
  # @npmcli/arborist (through glob 13 and others) ask for minimatch 9 and 10.
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  # GHSA-238p-pmpm-9mq7: markdownlint's math extension asks for katex 0.16.
  'katex@>=0.11.0 <0.18.2': ^0.18.2
  # GHSA-67mh-4wv8-2f99: drizzle-kit's @esbuild-kit loader asks for esbuild
  # 0.18.
  'esbuild@<0.25.0': ^0.25.0
