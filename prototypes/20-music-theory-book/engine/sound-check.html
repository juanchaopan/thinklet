<title>声音检查</title>
<style>
/* One column of numbered test buttons, each with its own result line, and a report box at the bottom the user can copy. */
:root { --canvas: #f7f4ef; --surface: #fff; --line: #ebe6dc; --ink: #161a2b; --soft: #4b5168; --ok: #1f7a4d; --bad: #b3261e; --violet: #6d3cf0; --font: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; --mono: ui-monospace, Consolas, monospace; color-scheme: light; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 16px/1.6 var(--font); }
.wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 14px; }
h1 { margin: 0; font-size: 26px; }
p { margin: 0; color: var(--soft); }
.test { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; }
button { font: inherit; font-weight: 700; min-height: 48px; border-radius: 12px; border: 0; background: var(--violet); color: #fff; cursor: pointer; }
button:active { transform: scale(.98); }
.res { font: 14px/1.5 var(--mono); color: var(--soft); white-space: pre-wrap; word-break: break-word; }
.res.ok { color: var(--ok); }
.res.bad { color: var(--bad); }
textarea { width: 100%; box-sizing: border-box; min-height: 180px; font: 13px/1.5 var(--mono); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
</style>

<div class="wrap">
  <h1>声音检查</h1>
  <p>请按顺序点下面四个按钮，每点一个说一下有没有听到声音。最后把最下面框里的文字整段复制给我。手机侧面的静音键开着、关着各试一次更好。</p>

  <div class="test"><button type="button" id="t1">1. 网页音频：嘀一声</button><div class="res" id="r1">还没测</div></div>
  <div class="test"><button type="button" id="t2">2. 媒体播放：嘀一声</button><div class="res" id="r2">还没测</div></div>
  <div class="test"><button type="button" id="t3">3. 加载钢琴采样</button><div class="res" id="r3">还没测</div></div>
  <div class="test"><button type="button" id="t4">4. 用钢琴弹 C–E–G</button><div class="res" id="r4">还没测</div></div>

  <textarea id="report" readonly aria-label="检查结果"></textarea>
</div>

<script>
/* The sound source's own check page. Each test isolates one link of the
   chain the engine uses: Web Audio output, media-element output, fetching
   the engine's piano samples (assets/piano.json beside the engine folder),
   and decoding plus playing a sample. The report collects everything. */
(function () {
  var PIANO_URL = '../assets/piano.json';
  var lines = [];
  var ctx = null, samples = null;
  function note(id, text, good) {
    var el = document.getElementById(id);
    el.textContent = text; el.className = 'res ' + (good === true ? 'ok' : good === false ? 'bad' : '');
    lines.push(id + ': ' + text);
    report();
  }
  function report() {
    var C = window.AudioContext || window.webkitAudioContext;
    var head = [
      'UA: ' + navigator.userAgent,
      'AudioContext: ' + (C ? '有' : '没有') + (ctx ? '，状态 ' + ctx.state + '，采样率 ' + ctx.sampleRate : ''),
      'audioSession: ' + (navigator.audioSession ? navigator.audioSession.type : '没有'),
      '页面地址: ' + location.protocol + '//' + location.host + location.pathname,
      '在框架里: ' + (window.top !== window.self)
    ];
    document.getElementById('report').value = head.concat(lines).join('\n');
  }
  function audio() {
    if (!ctx) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { lines.push('audioSession 设置失败: ' + e.message); }
      ctx = new C();
    }
    if (ctx.state !== 'running') ctx.resume().catch(function (e) { lines.push('resume 失败: ' + e.message); });
    return ctx;
  }
  function beepWav() {
    var rate = 22050, n = rate / 2, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    function s(o, t) { for (var i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); }
    s(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); s(8, 'WAVE'); s(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
    v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); s(36, 'data'); v.setUint32(40, n * 2, true);
    for (var i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin(2 * Math.PI * 660 * i / rate) * 9000 * Math.min(1, (n - i) / 2000), true);
    return new Blob([buf], { type: 'audio/wav' });
  }

  document.getElementById('t1').addEventListener('click', function () {
    var c = audio();
    if (!c) { note('r1', '这个浏览器没有 Web Audio', false); return; }
    var o = c.createOscillator(), g = c.createGain();
    o.frequency.value = 880; g.gain.setValueAtTime(.3, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .6);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + .65);
    setTimeout(function () { note('r1', '已发出（音频引擎状态 ' + c.state + '）。听到了吗？', c.state === 'running' ? null : false); }, 300);
  });

  document.getElementById('t2').addEventListener('click', function () {
    try {
      var a = new Audio(URL.createObjectURL(beepWav()));
      a.setAttribute('playsinline', '');
      a.play().then(function () { note('r2', '已发出。听到了吗？'); }).catch(function (e) { note('r2', '播放被拒绝：' + e.name + ' ' + e.message, false); });
    } catch (e) { note('r2', '出错：' + e.message, false); }
  });

  document.getElementById('t3').addEventListener('click', function () {
    var t0 = performance.now();
    note('r3', '正在加载…');
    fetch(PIANO_URL).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (j) {
      samples = j;
      note('r3', '加载成功：' + Object.keys(j).length + ' 个采样，用了 ' + Math.round(performance.now() - t0) + ' 毫秒', true);
    }).catch(function (e) { note('r3', '加载失败：' + (e && e.message || e), false); });
  });

  document.getElementById('t4').addEventListener('click', function () {
    var c = audio();
    if (!c) { note('r4', '这个浏览器没有 Web Audio', false); return; }
    if (!samples) { note('r4', '先点第 3 个按钮加载采样', false); return; }
    var key = Object.keys(samples).map(Number).sort(function (a, b) { return Math.abs(a - 60) - Math.abs(b - 60); })[0];
    var bin = atob(samples[key]), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    c.decodeAudioData(bytes.buffer, function (buf) {
      [60, 64, 67].forEach(function (m, k) {
        var src = c.createBufferSource(); src.buffer = buf; src.playbackRate.value = Math.pow(2, (m - key) / 12);
        src.connect(c.destination); src.start(c.currentTime + k * .4);
      });
      note('r4', '解码成功（' + buf.duration.toFixed(2) + ' 秒），已弹出。听到了吗？', true);
    }, function (e) { note('r4', '解码失败：' + (e && e.message || e), false); });
  });

  report();
})();
</script>
