id: rhythm-beats
kind: lecture
title: 节奏拆拍
summary: >-
  把节奏按时值等比例放到按拍分好的尺子上：先弄清一拍是什么、一小节几拍，再量、再切，
  然后一项一项地对。判断拍号、数有几个、写法对不对、单复拍改写四种小题都从这里出发。
grades: { from: 3, to: 6 }

player:
  opening: read
  sceneEnd: wait-next
  partEnd: clear-stack
  skip: true
  back: true
  wrong: [hint, demo]

stage:
  top: [close, question-menu, part-switch]
  head: [question-title]
  bottom: [scene-prev, narration, scene-next, replay]
  inputs:
    narration: { buttons: [pause, rate] }

roles:
  stack:
    title: 结论
    needs: [conclude]
    place: board
  material:
    title: 题目上的谱
    note: 题目上印的那一段，一直留在题目条上；读题时站到舞台中间。只有一句文字的题没有这个角色。
    optional: true
    needs: [point]
    uses: [play, positions]
    place: strip
  ruler:
    title: 拍尺
    note: 把节奏按时值等比例画开，按拍号分拍，能量、能数、能换成另一段节奏。
    needs: [meter, count, point, set]
    place: center
  compare:
    title: 对照拍尺
    note: 改写的小题里放改写后的那一段，和拍尺一拍对一拍。
    optional: true
    needs: [meter, count, point, set]
    place: center
  answer:
    title: 作答
    note: 只在对选项和提问的那几幕出现；轮到孩子作答时才能点。
    needs: [answer, point]
    uses: [strike, positions]
    place: center
  rule:
    title: 规则
    note: 写法的小题里，这种拍子的符尾和休止符怎么写。
    optional: true
    needs: [point, mask]
    place: popup

properties:
  answering:
    title: 作答点怎么答
    note: pick 是从几项里选一项，每项都对一遍，错的划掉；each 是每项各答一次，比如每个框、每句判断、每个空。
    type: { oneOf: [pick, each] }
  at:
    title: 这个小题指着素材的哪里
    type: spot
  meter:
    title: 题目给的拍号
    type: meter
  targetMeter:
    title: 改写成的拍号
    type: meter
  unit:
    title: 用什么时值来量
    note: 判断拍号时一般是这一小节最短的音符，有连音时用连音占的那一拍；数有几个时就是题目问的单位，比如附点四分音符。
    type: duration
  beat:
    title: 一拍的时值
    note: 按拍切开时一拍一拍地数，比如八分之六拍的一拍是附点四分音符。
    type: duration
  groups:
    title: 能看出拍子怎么分组的地方
    note: 符尾连成的组、三连音、二连音；每组是这一小节里的哪几个音，以及贴在旁边的字。
    type: groups
  items:
    title: 作答点
    type: list
    min: 1
    each:
      id: { type: id, required: true }
      at: { title: 指着素材的哪里, type: spot }
      rhythm: { title: 这一项放到拍尺上的节奏, type: rhythm }
      meter: { title: 这一项的拍号, note: 判断拍号时是这个选项的拍号；改写时是这个选项写的拍号, type: meter }
      spot: { title: 对这一项时拍尺上亮哪里, type: spot }
      fits: { title: 这一项对不对, note: answering 是 pick 时必填, type: boolean }
      answer: { title: 算对的答案, note: answering 是 each 时必填, type: answers }
      demo: { title: 演示时替孩子答的, note: 不给就用第一个算对的答案, type: answer }
  answer:
    title: 这个小题算对的答案
    note: answering 是 pick 时必填，可以有几种都算对。
    type: answers
  lines:
    title: 台词
    note: 按下面各幕每一步的编号写；逐项的那一幕每个作答点各写一份。答对、提示和演示时说的话也是台词。读题那一幕的台词写在整道题上。
    type: lines
  conclusions:
    title: 结论
    note: 按下面各幕的编号写；逐项的那一幕每个作答点可以各写一条。
    type: conclusions

parts:
  meter:
    title: 判断拍号
    note: 一小节节奏没有拍号，从几个拍号里选装得下、分组也对的那个。
    required: [answering, unit, groups, items, answer, lines, conclusions]
    optional: [at]
    scenes: [measure, grouping, each-item, choose]
  count:
    title: 数有几个
    note: 一小节里有几拍，或者一个时值等于几个另一个时值；可以没有素材，只有一句话。
    required: [unit, items, lines, conclusions]
    optional: [at, meter]
    fixed: { answering: each }
    scenes: [beat, measure, fill]
  notation:
    title: 写法对不对
    note: 符尾的连法、休止符的写法，按拍切开以后一项一项地对。
    required: [answering, meter, beat, items, lines, conclusions]
    optional: [at, unit, answer]
    scenes: [beat, rule, cut, each-item, choose]
  rewrite:
    title: 单复拍改写
    note: 同一段节奏换成另一种拍子，一拍对一拍：单拍子的三连音对复拍子的三个音，两个音对二连音。
    required: [answering, meter, targetMeter, beat, items, lines, conclusions]
    optional: [at, unit, answer]
    scenes: [beat, target-beat, cut, { scene: each-item, with: { on: compare } }, choose]

scenes:
  read:
    title: 读题
    prompt: open
    stage: [material]
    steps:
      - say: read.question
      - say: read.ask

  beat:
    title: 找拍
    when: { has: meter }
    stage: [ruler]
    steps:
      - say: beat.read
        do: { role: material, call: point.spotlight, with: $at, optional: true }
      - say: beat.unit
        do: { role: ruler, call: meter.show, with: $meter }
      - say: beat.split
        do: { role: ruler, call: meter.subdivide, with: $unit, optional: true }
      - conclude: beat
        from: ruler

  target-beat:
    title: 改写成的拍子
    stage: [ruler, compare]
    steps:
      - say: target.unit
        do: { role: compare, call: meter.show, with: $targetMeter }
      - say: target.match
      - conclude: target
        from: compare

  measure:
    title: 量一共多长
    stage: [ruler]
    steps:
      - say: measure.unit
        do: { role: material, call: point.spotlight, with: $at, optional: true }
      - show: { role: ruler, call: count.run, with: $unit }
      - say: measure.total
      - conclude: measure
        from: ruler

  grouping:
    title: 看怎么分组
    stage: [ruler]
    steps:
      - say: grouping.look
        do: { role: material, call: point.highlight, with: $groups, optional: true }
      - say: grouping.kind
        do: { role: ruler, call: point.label, with: $groups }
      - conclude: grouping
        from: ruler

  rule:
    title: 这种拍子怎么写
    when: { has: conclusions.rule }
    stage: [ruler]
    steps:
      - say: rule.open
        do: { role: rule, call: point.highlight, with: $at, optional: true }
      - conclude: rule

  cut:
    title: 按拍切开
    stage: [ruler]
    steps:
      - say: cut.lines
      - show: { role: ruler, call: count.run, with: $beat }
      - conclude: cut
        from: ruler

  each-item:
    title: 一项一项地对
    params: { on: { default: ruler } }
    repeat: items
    stage: [ruler, compare, answer]
    steps:
      - do: { role: $on, call: set, with: $item.rhythm, optional: true }
      - say: item.look
        do: { role: answer, call: point.spotlight, with: $item.id }
      - say: item.check
        do: { role: $on, call: meter.show, with: $item.meter, optional: true }
      - say: item.verdict
        do: { role: $on, call: point.highlight, with: $item.spot, optional: true }
      - when: { answering: pick, item.fits: false }
        show: { role: answer, call: strike, with: $item.id, optional: true }
      - when: { answering: each }
        act:
          wait: { role: answer, event: answer.given, item: $item.id }
          accept: $item.answer
          demo: $item.demo
          lines: { right: item.right, hint: item.hint, demo: item.demo }
      - conclude: item
        optional: true

  choose:
    title: 选出来
    when: { answering: pick }
    stage: [answer]
    skip: false
    steps:
      - say: choose.ask
        do: { role: answer, call: point.spotlight }
      - act:
          wait: { role: answer, event: answer.given }
          accept: $answer
          lines: { right: choose.right, hint: choose.hint, demo: choose.demo }
      - conclude: answer
        from: answer

  fill:
    title: 写出来
    repeat: items
    stage: [ruler, answer]
    skip: false
    steps:
      - say: fill.ask
        do: { role: answer, call: answer.focus, with: $item.id }
      - act:
          wait: { role: answer, event: answer.given, item: $item.id }
          accept: $item.answer
          demo: $item.demo
          lines: { right: fill.right, hint: fill.hint, demo: fill.demo }
      - conclude: answer
        from: answer
