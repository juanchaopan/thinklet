id: meter-demo
title: 判断拍号（示例）
workflow: rhythm-beats
theme: etude
prompt: Tick the correct time signature for each bar.

bind:
  stack: conclusion-stack
  material: score
  ruler: beat-grid
  answer: choice

inputs:
  material:
    abc: |-
      X:1
      M:none
      L:1/8
      K:C
      "^(a)"dcB A3 | "^(b)"(3ABc d2 B2 |]

parts:
  - kind: meter
    tag: (a)
    at: { bar: 1 }
    answering: pick
    unit: 1/8
    groups:
      - { notes: [0, 1, 2], label: '1' }
      - { notes: [3], label: '2' }
    inputs:
      ruler: { abc: "X:1\nL:1/8\nK:C\ndcB A3|", meter: '?' }
      answer:
        shape: list
        tag: (a)
        prompt: [{ text: Tick the correct time signature. }]
        options:
          - { id: '34', parts: [{ abc: "M:3/4\nK:C\nx" }], name: '3/4' }
          - { id: '68', parts: [{ abc: "M:6/8\nK:C\nx" }], name: '6/8' }
          - { id: '58', parts: [{ abc: "M:5/8\nK:C\nx" }], name: '5/8' }
    items:
      - id: '34'
        meter: 3/4
        fits: false
        lines:
          item.look: 第一个是四分之三拍。
          item.check: 放进去，长度正好是六个八分音符。
          item.verdict: 可是四分之三拍的一拍是四分音符，两个八分音符一组；这里是三个一组，对不上。
      - id: '68'
        meter: 6/8
        fits: true
        lines:
          item.look: 第二个是八分之六拍。
          item.check: 长度也是六个八分音符。
          item.verdict: 它的一拍是附点四分音符，正好三个八分音符一组，一共两拍。长度和分组都对上了。
      - id: '58'
        meter: 5/8
        fits: false
        lines:
          item.look: 第三个是八分之五拍。
          item.check: 它只有五个八分音符那么长，这一小节多出来一个，放不下。
          item.verdict: 所以八分之五拍也不对。
    answer: ['68']
    lines:
      measure.unit: 先看 (a) 这一小节。我们用最短的八分音符当尺子，量一量它有多长。
      measure.total: 一共是六个八分音符那么长。
      grouping.look: 再看符尾是怎么连的。
      grouping.kind: 前三个八分音符连成一组，后面的附点四分音符也正好是三个八分音符长。三个一组，一共两组。
      choose.ask: 现在请你在正确的拍号旁边打勾。
      choose.right: 对了，就是八分之六拍。
      choose.hint: 再想一想：哪个拍号长度对，又是三个八分音符一组？
      choose.demo: 我们一起来看，是八分之六拍。
    conclusions:
      measure: { parts: [{ term: '6' }, { text: ' quavers in the bar' }] }
      grouping: { parts: [{ text: 'grouped ' }, { term: '3 + 3' }, { op: '→' }, { text: ' compound time' }] }
      answer: { parts: [{ abc: "M:6/8\nK:C\nx" }], from: [measure, grouping], final: true }

  - kind: meter
    tag: (b)
    at: { bar: 2 }
    answering: pick
    unit: 1/8
    groups:
      - { notes: [0, 1, 2], label: '1' }
      - { notes: [3], label: '2' }
      - { notes: [4], label: '3' }
    inputs:
      ruler: { abc: "X:1\nL:1/8\nK:C\n(3ABc d2 B2|", meter: '?' }
      answer:
        shape: list
        tag: (b)
        prompt: [{ text: Tick the correct time signature. }]
        options:
          - { id: '68', parts: [{ abc: "M:6/8\nK:C\nx" }], name: '6/8' }
          - { id: '34', parts: [{ abc: "M:3/4\nK:C\nx" }], name: '3/4' }
          - { id: '24', parts: [{ abc: "M:2/4\nK:C\nx" }], name: '2/4' }
    items:
      - id: '68'
        meter: 6/8
        fits: false
        lines:
          item.look: 第一个是八分之六拍。
          item.check: 长度正好。
          item.verdict: 可是八分之六拍每拍分成三份；这里有三连音，说明本来每拍只分两份，所以不对。
      - id: '34'
        meter: 3/4
        fits: true
        lines:
          item.look: 第二个是四分之三拍。
          item.check: 长度正好，三拍。
          item.verdict: 每拍一个四分音符，三连音挤进一拍里，分组也对上了。
      - id: '24'
        meter: 2/4
        fits: false
        lines:
          item.look: 第三个是四分之二拍。
          item.check: 它只有四个八分音符那么长，放不下。
          item.verdict: 所以四分之二拍不对。
    answer: ['34']
    lines:
      measure.unit: 再看 (b)。还是用八分音符来量。
      measure.total: 三连音的三个音只占两个八分音符的长度，所以一共也是六个八分音符。
      grouping.look: 这次看三连音和后面两个四分音符。
      grouping.kind: 三连音正好占一拍，后面两个四分音符各是一拍。每一拍分成两份，一共三拍。
      choose.ask: 请你选出 (b) 的拍号。
      choose.right: 对了，是四分之三拍。
      choose.hint: 提示：三连音告诉我们，每拍本来分成两份。
      choose.demo: 我们一起来看，是四分之三拍。
    conclusions:
      measure: { parts: [{ term: '6' }, { text: ' quavers in the bar' }] }
      grouping: { parts: [{ text: 'triplet = 1 beat' }, { op: '→' }, { text: ' simple time' }] }
      answer: { parts: [{ abc: "M:3/4\nK:C\nx" }], from: [measure, grouping], final: true }
