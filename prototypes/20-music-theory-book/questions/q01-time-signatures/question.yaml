id: q01-time-signatures
title: 判断拍号
workflow: rhythm-beats
theme: etude
prompt:
  text: 下面每一小节都没有写拍号。给每一小节选出正确的拍号。
  gloss: Tick the correct time signature for each of these bars.

bind:
  stack: conclusion-stack
  material: score
  ruler: beat-grid
  answer: choice

inputs:
  material:
    abc: |-
      X:1
      M:none
      L:1/8
      K:C
      "^(a)"BAG d2B | [K:C clef=bass]"^(b)"D,E, F,G, A,2F, |[K:C clef=treble]
      "^(c)"(3cBA GA |]

lines:
  read.question: 这道题给了三小节节奏，(a)、(b)、(c)，每一小节都没有写拍号。
  read.ask: 我们要给每一小节，从三个拍号里选出正确的那一个。办法是：先量一共有多长，再看音符是怎么分组的。先看 (a)。

parts:
  - kind: meter
    tag: (a)
    at: { bar: 1 }
    answering: pick
    unit: 1/8
    groups:
      - { notes: [0, 1, 2], label: '1' }
      - { notes: [3, 4], label: '2' }
    inputs:
      ruler: { abc: "X:1\nL:1/8\nK:C\nBAG d2B|", meter: '?' }
      answer:
        shape: list
        tag: (a)
        prompt: [{ text: 选出正确的拍号。 }]
        options:
          - { id: '34', parts: [{ abc: "M:3/4\nK:C\nx" }], name: '3/4' }
          - { id: '68', parts: [{ abc: "M:6/8\nK:C\nx" }], name: '6/8' }
          - { id: '58', parts: [{ abc: "M:5/8\nK:C\nx" }], name: '5/8' }
    items:
      - id: '34'
        meter: 3/4
        fits: false
        lines:
          item.look: 第一个是四分之三拍。
          item.check: 放进去，长度正好是六个八分音符，长度是对的。
          item.verdict: 可是四分之三拍的一拍是四分音符，八分音符应该两个两个连在一起；这里是三个一组，对不上。
      - id: '68'
        meter: 6/8
        fits: true
        lines:
          item.look: 第二个是八分之六拍。
          item.check: 长度也是六个八分音符。
          item.verdict: 它的一拍是附点四分音符，正好是三个八分音符一组，一共两拍。长度和分组都对上了。
      - id: '58'
        meter: 5/8
        fits: false
        lines:
          item.look: 第三个是八分之五拍。
          item.check: 它只有五个八分音符那么长，这一小节多出来一个，放不下。
          item.verdict: 所以八分之五拍也不对。
    answer: ['68']
    lines:
      measure.unit: 先看 (a) 这一小节。我们用最短的八分音符当尺子，一个一个地量。
      measure.total: 一共是六个八分音符那么长。
      grouping.look: 再看符尾是怎么连的。
      grouping.kind: 前三个八分音符连成一组，后面的四分音符加一个八分音符，也正好是三个八分音符长。三个一组，一共两组。
      choose.ask: 现在请你选：(a) 是哪个拍号？在它的框里打勾。
      choose.right: 对了，就是八分之六拍。
      choose.hint: 再想一想：哪个拍号长度对，又是三个八分音符一组？
      choose.demo: 我们一起来看，是八分之六拍。
    conclusions:
      measure: { parts: [{ text: 一共 6 个八分音符 }] }
      grouping: { parts: [{ text: 三个一组 }, { op: '→' }, { text: 复拍子 }] }
      answer: { parts: [{ abc: "M:6/8\nK:C\nx" }, { text: 八分之六拍 }], from: [measure, grouping], final: true }

  - kind: meter
    tag: (b)
    at: { bar: 2 }
    answering: pick
    unit: 1/8
    groups:
      - { notes: [0, 1], label: '1' }
      - { notes: [2, 3], label: '2' }
      - { notes: [4, 5], label: '3' }
    inputs:
      ruler: { abc: "X:1\nL:1/8\nK:C clef=bass\nD,E, F,G, A,2F,|", meter: '?' }
      answer:
        shape: list
        tag: (b)
        prompt: [{ text: 选出正确的拍号。 }]
        options:
          - { id: '74', parts: [{ abc: "M:7/4\nK:C clef=bass\nx" }], name: '7/4' }
          - { id: '78', parts: [{ abc: "M:7/8\nK:C clef=bass\nx" }], name: '7/8' }
          - { id: '68', parts: [{ abc: "M:6/8\nK:C clef=bass\nx" }], name: '6/8' }
    items:
      - id: '74'
        meter: 7/4
        fits: false
        lines:
          item.verdict: 四分之七拍要七个四分音符，也就是十四个八分音符那么长，这一小节只有七个，差得远。
      - id: '78'
        meter: 7/8
        fits: true
        lines:
          item.verdict: 八分之七拍正好七个八分音符，按两个、两个、三个分组，和符尾的连法一样。
      - id: '68'
        meter: 6/8
        fits: false
        lines:
          item.verdict: 八分之六拍只有六个八分音符那么长，放不下。
    answer: ['78']
    lines:
      measure.unit: 再看 (b)，它是低音谱号。还是用八分音符来量。
      measure.total: 一共是七个八分音符。七，不是三的倍数，也不是二的倍数。
      grouping.look: 看符尾：两个、两个，最后三个。
      grouping.kind: 拍子长短不一样，这叫不规则拍子。
      choose.ask: 请你选：(b) 是哪个拍号？
      choose.right: 对了，是八分之七拍。
      choose.hint: 先数一共几个八分音符，再看哪个拍号正好装下。
      choose.demo: 我们一起来看，是八分之七拍。
    conclusions:
      measure: { parts: [{ text: 一共 7 个八分音符 }] }
      grouping: { parts: [{ text: 2 + 2 + 3 }, { op: '→' }, { text: 不规则拍子 }] }
      answer: { parts: [{ abc: "M:7/8\nK:C clef=bass\nx" }, { text: 八分之七拍 }], from: [measure, grouping], final: true }

  - kind: meter
    tag: (c)
    at: { bar: 3 }
    answering: pick
    unit: 1/4
    groups:
      - { notes: [0, 1, 2], label: '1' }
      - { notes: [3, 4], label: '2' }
    inputs:
      ruler: { abc: "X:1\nL:1/8\nK:C\n(3cBA GA|", meter: '?' }
      answer:
        shape: list
        tag: (c)
        prompt: [{ text: 选出正确的拍号。 }]
        options:
          - { id: '68', parts: [{ abc: "M:6/8\nK:C\nx" }], name: '6/8' }
          - { id: '24', parts: [{ abc: "M:2/4\nK:C\nx" }], name: '2/4' }
          - { id: '38', parts: [{ abc: "M:3/8\nK:C\nx" }], name: '3/8' }
    items:
      - id: '68'
        meter: 6/8
        fits: false
        lines:
          item.verdict: 前面三个音看着像三个一组，可它们是三连音，只占一个四分音符；八分之六拍要三个四分音符那么长，放不下这么多。
      - id: '24'
        meter: 2/4
        fits: true
        lines:
          item.verdict: 四分之二拍是两个四分音符那么长：三连音一拍，后面两个八分音符一拍，正好。
      - id: '38'
        meter: 3/8
        fits: false
        lines:
          item.verdict: 八分之三拍只有一个半四分音符那么长，这一小节多出来了。
    answer: ['24']
    lines:
      measure.unit: 最后看 (c)。前三个音上面有个 3，这是三连音：三个八分音符挤在一个四分音符的时间里。所以这次用四分音符来量。
      measure.total: 三连音一拍，后面两个八分音符一拍，一共两个四分音符。
      grouping.look: 看分组：三连音一组，后面两个八分音符一组。
      grouping.kind: 每一拍是一个四分音符，这是单拍子。
      choose.ask: 请你选：(c) 是哪个拍号？
      choose.right: 对了，是四分之二拍。
      choose.hint: 三连音只占一个四分音符。一共几个四分音符？
      choose.demo: 我们一起来看，是四分之二拍。
    conclusions:
      measure: { parts: [{ text: 一共 2 个四分音符 }] }
      grouping: { parts: [{ text: 三连音 = 1 拍 }, { op: '→' }, { text: 单拍子 }] }
      answer: { parts: [{ abc: "M:2/4\nK:C\nx" }, { text: 四分之二拍 }], from: [measure, grouping], final: true }
